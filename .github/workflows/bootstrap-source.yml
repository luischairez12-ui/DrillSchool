name: One-time DrillSchool source import
on:
  push:
    branches: [main]
    paths: ['.bootstrap/READY']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'luischairez12-ui/DrillSchool'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack verified DrillSchool v0.2.0 sources
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/READY
          cat .bootstrap/chunk-*.b64 | base64 --decode > /tmp/drillschool-v020.tar.xz
          echo "14fa393e8a455628e159f1b108d3d9754602e37e5abac29667d44a7d7d52117f  /tmp/drillschool-v020.tar.xz" | sha256sum -c -
          tar -xJf /tmp/drillschool-v020.tar.xz -C .
          rm -rf .bootstrap
          # Workflow-file updates are performed separately via the GitHub connector.
          rm -f .github/workflows/android-apk.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Import DrillSchool v0.2.0 Operator Seat complete sources'
          git push origin HEAD:main
